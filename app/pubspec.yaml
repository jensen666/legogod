name: legogod_app
description: "LEGOGOD 手机 APP：连接真实 LEGOGOD API 服务，完成创作、任务管理、3D 作品、拼装步骤与运行复盘。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.3.3
  url_launcher: ^6.3.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
