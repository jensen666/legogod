name: Bug 报告
description: 报告可复现的问题（请先脱敏，不要粘贴密钥或个人信息）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请确认：
        - 已按 README 的安装步骤在干净环境复现；
        - 已删除截图/日志中的 API key、令牌、内网地址与个人信息；
        - 安全漏洞请勿公开提交，走 Security → Report a vulnerability。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 实际发生了什么，与你的预期有什么差异。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动命令开始，逐步写清操作。
      placeholder: |
        1. 执行 ...
        2. 打开 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 仓库版本、commit SHA 或 Release 版本。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python/Flutter 版本、浏览器或设备型号（不含个人设备标识）。
      placeholder: |
        OS: Windows 11
        Python: 3.11.1
        Flutter: 3.38.7
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（已脱敏）
      description: 请删除令牌、路径中的用户名、内网地址与任务原文。
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认这不是安全漏洞（安全漏洞走私有漏洞报告）
          required: true
        - label: 我已删除提交内容中的密钥与个人信息
          required: true
