name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到的具体使用场景或痛点。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望看到的行为或能力。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 适用范围
      options:
        - label: 影响 Web 端
        - label: 影响 Android APP
        - label: 影响服务端 / 生成链路
        - label: 仅文档
