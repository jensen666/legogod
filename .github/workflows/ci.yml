name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install package with Pillow extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pillow]"
          python -m pip install -r requirements-dev.txt
      - name: Verify public fixtures manifest
        run: python .github/scripts/check_public.py fixtures
      - name: Run core tests
        run: python -m pytest test -q --junitxml=test-report.xml
      - name: Check public test coverage (no silent skips)
        if: always()
        run: python .github/scripts/check_public.py tests test-report.xml

  base-no-pillow:
    name: Base install (no Pillow)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install base package (no Pillow)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Verify Pillow is not installed
        run: python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('PIL') is None else 1)"
      - name: Verify CLI entry points
        run: |
          python -m legogod --help
          python -m legogod build --help
      - name: Verify base chain tests
        run: python -m pytest test/test_geometry.py test/test_validation.py test/test_design_support.py -q

  app:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test

  integrity:
    name: Public repo integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check repository content policy
        run: python .github/scripts/check_public.py policy
